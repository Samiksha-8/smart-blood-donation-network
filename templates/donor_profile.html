<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | BloodNet</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}">
 </head>     

<body>

    <aside class="sidebar" id="sidebar">

    <a href="{{ url_for('home') }}"
       class="dashboard-logo">

        <div class="dashboard-logo-icon">
            ❤
        </div>

        <span>
            BloodNet
        </span>

    </a>


    <nav class="sidebar-nav">

        <p class="nav-label">
            MAIN
        </p>


        <a href="{{ url_for('donor.dashboard') }}"
           class="sidebar-link">

            <span>⌂</span>
            Dashboard

        </a>


        <a href="{{ url_for('donor.requests') }}"
           class="sidebar-link">

            <span>🩸</span>
            Blood Requests

        </a>


        <p class="nav-label">
            YOUR ACTIVITY
        </p>


        <a href="{{ url_for('donor.donation_history') }}"
           class="sidebar-link">

            <span>📋</span>
            Donation History

        </a>


        <a href="{{ url_for('donor.profile') }}"
           class="sidebar-link active">

            <span>👤</span>
            My Profile

        </a>

    </nav>


    <div class="sidebar-bottom">

        <a href="{{ url_for('auth.logout') }}"
           class="sidebar-link logout-link">

            <span>↪</span>
            Logout

        </a>

    </div>

</aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>
                <div class="page-eyebrow">
                    ACCOUNT
                </div>

                <h1>My Profile</h1>

                <p>
                    View and update your donor information.
                </p>
            </div>

        </header>


       <section class="dashboard-card profile-card">

            <div class="card-header">

                <div>
                    <div class="section-eyebrow">
                        PERSONAL INFORMATION
                    </div>

                    <h2>Profile Details</h2>
                </div>

            </div>


            <form method="POST" class="profile-form">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            name="full_name"
                            value="{{ user.full_name }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            value="{{ user.email }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ user.phone }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Blood Group</label>

                        <input
                            type="text"
                            value="{{ donor.blood_group }}"
                            disabled
                        >

                    </div>


                    <div class="form-group">

                        <label>City</label>

                        <input
                            type="text"
                            name="city"
                            value="{{ donor.city }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Weight (kg)</label>

                        <input
                            type="number"
                            name="weight"
                            value="{{ donor.weight }}"
                            min="1"
                            step="0.1"
                            required
                        >

                    </div>

                </div>


                <div class="profile-actions">

                    <a href="{{ url_for('donor.dashboard') }}"
                       class="secondary-button">
                        Cancel
                    </a>

                    <button type="submit"
                            class="primary-button">
                        Save Changes
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
